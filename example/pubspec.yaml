name: hls_proxy_player_example
description: Example Android TV NAS player built on the hls_proxy_player library.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hls_proxy_player:
    path: ../
  video_player: ^2.8.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  pointycastle: ^3.9.1
  crypto: ^3.0.3
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
