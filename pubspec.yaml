name: hls_proxy_player
description: Reusable Flutter toolkit that plays HLS/m3u8 through a local proxy with on-the-fly AES-128 decryption and segment merging, plus a minimal PASV FTP transport for streaming your own NAS content without a media server. Ships with an example Android TV NAS player.
publish_to: 'none' # set to your pub.dev URL when ready to publish
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  path_provider: ^2.1.0
  path: ^1.9.0
  pointycastle: ^3.9.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
