name: hls_web_player
description: 通用 HLS 播放器：播放标准 m3u8 视频，并支持通过本地代理播放用户自有 NAS(FTP) 上的分片内容。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  video_player: ^2.8.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  pointycastle: ^3.9.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # 本分支不内置任何站点配置文件（无 assets 依赖）。
