name: hls_proxy_player
description: Zero-media-server Android TV NAS player + reusable local-proxy HLS library (on-the-fly AES-128 decrypt & merge).
publish_to: 'none' # 发布到 pub.dev 时改为对应 URL
# 发布前请把下面三个 URL 替换成你的真实仓库地址
repository: https://github.com/dominic717/hls_proxy_player
homepage: https://github.com/dominic717/hls_proxy_player#readme
issue_tracker: https://github.com/dominic717/hls_proxy_player/issues
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  path_provider: ^2.1.0
  path: ^1.9.0
  pointycastle: ^3.9.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
