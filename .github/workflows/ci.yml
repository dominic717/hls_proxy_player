name: CI

on:
  push:
    branches: [main, hub, master]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      # --- library (repo root) ---
      - name: Library pub get & analyze
        run: |
          flutter pub get
          flutter analyze

      # --- example app ---
      - name: Example pub get, analyze & test
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test
